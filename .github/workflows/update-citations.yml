name: Update Scholar citations

on:
  schedule:
    - cron: "17 11 * * *"   # once a day, 11:17 UTC (about 5 am in Alabama)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch citation counts
        run: python scripts/update_citations.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          git diff --staged --quiet || (git commit -m "Update Scholar citation counts" && git push)
